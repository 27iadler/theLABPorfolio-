<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio | The Lab Miami</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --black: #0f120e;
    --off-white: #f9f4e1;
    --aqua: #1bb2b1;
    --pool-blue: #7cced0;
    --night-palm: #146d68;
    --tropical-green: #b5cfb2;
    --pink: #f8a79d;
    --surface: #181c17;
    --surface-hover: #1f2620;
    --border: rgba(255,255,255,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; }
  body { background: var(--black); color: var(--off-white); font-family: 'Montserrat', sans-serif; min-height: 100vh; }

  /* HEADER */
  .site-header {
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 3rem;
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  }
  .eyebrow { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--aqua); display: block; margin-bottom: 0.3rem; }
  .site-header h1 { font-weight: 900; font-size: clamp(1.8rem, 5vw, 3.2rem); text-transform: uppercase; letter-spacing: -0.01em; line-height: 1; }
  .header-meta { font-family: 'EB Garamond', serif; font-style: italic; color: rgba(249,244,225,0.5); text-align: right; line-height: 1.6; }

  /* MAIN */
  .site-main { max-width: 1400px; margin: 0 auto; padding: 2.5rem 3rem; }

  /* CONTROLS */
  .controls { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
  .search-input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 2px;
    color: var(--off-white); font-family: 'Montserrat', sans-serif; font-size: 0.85rem;
    letter-spacing: 0.04em; padding: 0.75rem 1rem; width: 100%; max-width: 420px; outline: none;
    transition: border-color 200ms;
  }
  .search-input::placeholder { color: rgba(249,244,225,0.35); }
  .search-input:focus { border-color: var(--aqua); }
  .count { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(249,244,225,0.4); margin-bottom: 0.5rem; }

  /* GRID */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }

  /* CARD */
  .card {
    background: var(--surface); padding: 2rem; display: flex; flex-direction: column; gap: 1rem;
    min-height: 180px; position: relative; overflow: hidden; cursor: default;
    transition: background 200ms;
  }
  .card:hover { background: var(--surface-hover); }
  .card::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: var(--aqua); transform: scaleX(0); transform-origin: left; transition: transform 220ms cubic-bezier(0.4,0,0.2,1);
  }
  .card:hover::after { transform: scaleX(1); }

  .card-avatar {
    width: 48px; height: 48px; border-radius: 2px; background: var(--night-palm);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 1.2rem; color: var(--off-white); text-transform: uppercase; flex-shrink: 0;
    overflow: hidden;
  }
  .card-avatar img { width: 100%; height: 100%; object-fit: contain; }

  .card-body { flex: 1; }
  .card-name { font-weight: 900; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; line-height: 1.2; margin-bottom: 0.4rem; }
  .card-what { font-family: 'EB Garamond', serif; font-size: 0.95rem; color: rgba(249,244,225,0.55); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .card-footer { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .tag {
    border-radius: 100px; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; padding: 0.2rem 0.65rem; text-transform: uppercase;
    background: rgba(27,178,177,0.12); border: 1px solid rgba(27,178,177,0.25); color: var(--aqua);
  }
  .tag-green { background: rgba(181,207,178,0.1); border-color: rgba(181,207,178,0.25); color: var(--tropical-green); }

  /* EMPTY */
  .empty { font-family: 'EB Garamond', serif; font-style: italic; color: rgba(249,244,225,0.4); text-align: center; padding: 5rem 0; font-size: 1.1rem; }

  /* FOOTER */
  .site-footer { border-top: 1px solid var(--border); margin-top: 5rem; padding: 2rem 3rem; display: flex; align-items: center; justify-content: space-between; }
  .footer-name { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(249,244,225,0.3); }
  .footer-star { color: var(--aqua); font-size: 1.4rem; }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .site-header, .site-main, .site-footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    .header-meta { text-align: left; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div>
    <span class="eyebrow">The Lab Miami</span>
    <h1>Portfolio</h1>
  </div>
  <p class="header-meta">26 companies building<br>the future in Miami</p>
</header>

<main class="site-main">
  <div class="controls">
    <input class="search-input" type="text" placeholder="Search companies…" id="search" aria-label="Search" />
  </div>
  <p class="count" id="count">26 companies</p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No companies match your search.</div>
</main>

<footer class="site-footer">
  <span class="footer-name">The Lab Miami</span>
  <span class="footer-star">*</span>
</footer>

<script>
const COMPANIES = [{"name":"Alchemy Bio","what":"AI data engine for biopharma R&D, regulatory, and commercialization.","round":"","raised":"","icon":""},{"name":"BitBasel","what":"Crypto art and NFT community platform based in Wynwood.","round":"","raised":"","icon":""},{"name":"Bonding Health","what":"App supporting parents raising kids with ADHD.","round":"","raised":"","icon":""},{"name":"Chummy's Customs","what":"Custom sneaker design and customization for athletes and brands.","round":"","raised":"","icon":""},{"name":"Coinward","what":"Bitcoin investment research and community.","round":"","raised":"","icon":""},{"name":"Da Blue Box","what":"IT strategy, managed services, and cybersecurity consulting.","round":"","raised":"","icon":""},{"name":"DIBS Parking","what":"Peer-to-peer marketplace for event and stadium parking.","round":"","raised":"","icon":""},{"name":"Fintrade Software LLC","what":"SaaS platform for non-bank lenders.","round":"","raised":"","icon":""},{"name":"Gusaga","what":"Construction payment and cost-compliance consulting.","round":"","raised":"","icon":""},{"name":"Intrigma","what":"Scheduling software for hospital and urgent-care staff.","round":"","raised":"","icon":""},{"name":"Jetlane","what":"Early-stage AI healthtech venture.","round":"","raised":"","icon":""},{"name":"Le Gourmand International","what":"Imports and distributes specialty food oils.","round":"","raised":"","icon":""},{"name":"Leefy Organics","what":"Direct-to-consumer wellness tinctures and supplements.","round":"","raised":"","icon":""},{"name":"Markeltree","what":"Custom software, AI automation, and mobile app development agency.","round":"","raised":"","icon":""},{"name":"Miami Kitchen Incubator","what":"Shared commercial kitchen space for food entrepreneurs.","round":"","raised":"","icon":""},{"name":"Nestron AI","what":"Early-stage cybersecurity/threat-intelligence venture.","round":"","raised":"","icon":""},{"name":"Patterned","what":"Verifies whether job candidates are actually ready to work, not just credentialed.","round":"","raised":"","icon":""},{"name":"Peach LED","what":"Large-format LED walls and screens for events and venues.","round":"","raised":"","icon":""},{"name":"Talking Schema","what":"AI tool for designing database schemas.","round":"","raised":"","icon":""},{"name":"The Minty Lab","what":"3D animation, CGI, and VFX production studio.","round":"","raised":"","icon":""},{"name":"Trampoline Health","what":"In-person mental wellness and movement sessions in Miami.","round":"","raised":"","icon":""},{"name":"Virtus Flow","what":"No-code automation software for business workflows.","round":"","raised":"","icon":""},{"name":"Vital","what":"Smart in-room beverage dispensers that auto-restock hotel minibars.","round":"","raised":"","icon":""},{"name":"Web Design Miami Company","what":"Local web design and development services.","round":"","raised":"","icon":""},{"name":"WRTH","what":"AI-native commerce intelligence for rare collectibles like watches and sneakers.","round":"","raised":"","icon":""},{"name":"You Health","what":"Helps people compare and choose health insurance plans.","round":"","raised":"","icon":""}];

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const search = document.getElementById('search');

function initial(name) { return name.trim().charAt(0).toUpperCase(); }

function renderCard(c) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <div class="card-avatar">
      ${c.icon ? `<img src="${c.icon}" alt="${c.name}" loading="lazy" />` : initial(c.name)}
    </div>
    <div class="card-body">
      <div class="card-name">${c.name}</div>
      ${c.what ? `<div class="card-what">${c.what}</div>` : ''}
    </div>
    ${(c.round || c.raised) ? `
    <div class="card-footer">
      ${c.round ? `<span class="tag">${c.round}</span>` : ''}
      ${c.raised ? `<span class="tag tag-green">${c.raised}</span>` : ''}
    </div>` : ''}
  `;
  return div;
}

function render(list) {
  grid.innerHTML = '';
  if (list.length === 0) {
    grid.style.display = 'none';
    emptyEl.style.display = 'block';
  } else {
    grid.style.display = 'grid';
    emptyEl.style.display = 'none';
    list.forEach(c => grid.appendChild(renderCard(c)));
  }
  const n = list.length;
  countEl.textContent = `${n} ${n === 1 ? 'company' : 'companies'}`;
}

search.addEventListener('input', () => {
  const q = search.value.toLowerCase();
  render(q ? COMPANIES.filter(c =>
    c.name.toLowerCase().includes(q) || c.what.toLowerCase().includes(q)
  ) : COMPANIES);
});

render(COMPANIES);
</script>
</body>
</html>
